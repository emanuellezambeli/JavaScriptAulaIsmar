<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Controle de Estoque - Supermercado</title>
  <link rel="stylesheet" href="arquivo_6.css">
</head>
<body>

  <header>
    <h1>Mercado</h1>
    <div class="btn-group">
      <button onclick="abrirModal()">Inserir Produto</button>
      <button class="btn-success" onclick="salvarInformacoes()">Salvar estoque</button>
    </div>
  </header>

  <main class="grid-container" id="gridProdutos"></main>

  <!-- Modal para Inserção -->
  <div class="modal-overlay" id="modalOverlay">
    <div class="modal">
      <h2>Inserir Produto</h2>
      <form id="formProdutos" onsubmit="adicionarProduto(event)">
        <div class="form-group">
          <label for="nome">Nome do Produto:</label>
          <input type="text" id="nome" required>
        </div>
        <div class="form-group">
          <label for="quantidade">Quantidade em Estoque:</label>
          <input type="number" id="quantidade" required min="1">
        </div>
        <div class="form-group">
          <label for="imagem">URL da Imagem:</label>
          <input type="url" id="imagem" placeholder="https://..." required>
        </div>
        <div class="form-group">
          <label for="descricao">Descrição:</label>
          <input type="text" id="descricao" placeholder="Ex: Fruta citrica e madura" required>
        </div>
        <div class="modal-actions">
          <button type="button" class="btn-cancel" onclick="fecharModal()">Cancelar</button>
          <button type="submit">Adicionar</button>
        </div>
      </form>
    </div>
  </div>
  <script src="arquivo_6.js"></script>
</body>
</html>
