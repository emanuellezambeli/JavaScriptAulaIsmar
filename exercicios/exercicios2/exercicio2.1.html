
<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            background: linear-gradient(135deg, #dbeafe, #eff6ff);
        }

        .container {
            background: white;
            padding: 35px;
            border-radius: 20px;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.12);
            width: 90%;
            max-width: 600px;
            text-align: center;
        }

        h1 {
            color: #1e3a8a;
            margin-bottom: 10px;
        }

        p {
            color: #64748b;
            margin-bottom: 25px;
        }

        .campos {
            display: flex;
            justify-content: center;
            gap: 12px;
            flex-wrap: wrap;
            margin-bottom: 25px;
        }

        input {
            width: 130px;
            padding: 14px;
            font-size: 18px;
            text-align: center;
            border: 2px solid #cbd5e1;
            border-radius: 10px;
            outline: none;
        }

        input:focus {
            border-color: #2563eb;
        }

        .operacoes {
            display: flex;
            justify-content: center;
            gap: 12px;
            flex-wrap: wrap;
        }

        .btn-operacao {
            width: 65px;
            height: 65px;
            background: #2563eb;
            border: none;
            border-radius: 12px;
            cursor: pointer;
            transition: 0.3s;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .btn-operacao:hover {
            background: #1e40af;
            transform: translateY(-4px);
        }

        .btn-operacao svg {
            width: 30px;
            height: 30px;
            stroke: white;
            fill: none;
            stroke-width: 2.5;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        .resultado-area {
            margin-top: 30px;
            text-align: left;
        }

        .resultado-area label {
            display: block;
            color: #1e3a8a;
            font-weight: bold;
            margin-bottom: 10px;
        }

        #resultado {
            width: 100%;
            background: #eff6ff;
            border: 2px solid #bfdbfe;
            color: #1e40af;
            font-size: 24px;
            font-weight: bold;
            text-align: center;
        }

        .limpar {
            margin-top: 20px;
            padding: 12px 25px;
            background: #64748b;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 15px;
        }

        .limpar:hover {
            background: #475569;
        }

        #mensagem {
            color: #dc2626;
            margin-top: 15px;
            font-size: 14px;
        }

    </style>
</head>

<body>

    <div class="container">

        <h1>Calculadora</h1>
        <p>Escolha uma operação matemática</p>

        <div class="campos">

            <input type="number" id="valor1" placeholder="Número 1">

            <input type="number" id="valor2" placeholder="Número 2">

        </div>

        <div class="operacoes">

            <!-- Porcentagem -->
            <button class="btn-operacao" onclick="calcular('porcentagem')" title="Porcentagem">
                <svg viewBox="0 0 24 24">
                    <circle cx="6" cy="6" r="2.5"/>
                    <circle cx="18" cy="18" r="2.5"/>
                    <path d="M19 5L5 19"/>
                </svg>
            </button>

            <!-- Adição -->
            <button class="btn-operacao" onclick="calcular('soma')" title="Adição">
                <svg viewBox="0 0 24 24">
                    <path d="M12 5V19M5 12H19"/>
                </svg>
            </button>

            <!-- Subtração -->
            <button class="btn-operacao" onclick="calcular('subtracao')" title="Subtração">
                <svg viewBox="0 0 24 24">
                    <path d="M5 12H19"/>
                </svg>
            </button>

            <!-- Divisão -->
            <button class="btn-operacao" onclick="calcular('divisao')" title="Divisão">
                <svg viewBox="0 0 24 24">
                    <path d="M5 12H19"/>
                    <circle cx="12" cy="5" r="1"/>
                    <circle cx="12" cy="19" r="1"/>
                </svg>
            </button>

            <!-- Potenciação -->
            <button class="btn-operacao" onclick="calcular('potencia')" title="Potenciação">
                <svg viewBox="0 0 24 24">
                    <path d="M4 19L9 5L14 19"/>
                    <path d="M6 14H12"/>
                    <path d="M16 8L18 5L21 8"/>
                    <path d="M16 11H21"/>
                </svg>
            </button>

        </div>

        <div class="resultado-area">

            <label for="resultado">Resultado:</label>

            <input type="text" id="resultado" readonly placeholder="0">

        </div>

        <div id="mensagem"></div>

        <button class="limpar" onclick="limpar()">Limpar calculadora</button>

    </div>

    <script>

        function calcular(operacao) {

            const valor1 = document.getElementById("valor1").value;
            const valor2 = document.getElementById("valor2").value;

            const resultado = document.getElementById("resultado");
            const mensagem = document.getElementById("mensagem");

            // Verificando se os campos estão vazios
            if (valor1 === "" || valor2 === "") {
                mensagem.innerText = "Digite os dois números!";
                resultado.value = "";
                return;
            }

            const numero1 = Number(valor1);
            const numero2 = Number(valor2);

            let calculo;

            mensagem.innerText = "";

            // Operações matemáticas

            if (operacao === "porcentagem") {

                calculo = (numero1 * numero2) / 100;

            }

            else if (operacao === "soma") {

                calculo = numero1 + numero2;

            }

            else if (operacao === "subtracao") {

                calculo = numero1 - numero2;

            }

            else if (operacao === "divisao") {

                if (numero2 === 0) {
                    mensagem.innerText = "O segundo número deve ser diferente de zero!";
                    resultado.value = "";
                    return;
                }

                calculo = numero1 / numero2;

            }

            else if (operacao === "potencia") {

                calculo = numero1 ** numero2;

            }

            // Exibindo o resultado

            resultado.value = calculo;

        }

        // Limpando os campos

        function limpar() {

            document.getElementById("valor1").value = "";
            document.getElementById("valor2").value = "";
            document.getElementById("resultado").value = "";
            document.getElementById("mensagem").innerText = "";

        }

    </script>

</body>
</html>
