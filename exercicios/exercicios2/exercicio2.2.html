
<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Calculadora de Gauss</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            font-family: Georgia, "Times New Roman", serif;

            display: flex;
            justify-content: center;
            align-items: center;

            background: linear-gradient(135deg, #171717, #34302a);
            padding: 20px;
        }

        .quadro {
            position: relative;
            width: 100%;
            max-width: 850px;

            background: #e9d5a5;
            border: 10px solid #8b693d;
            border-radius: 8px;

            padding: 35px;
            text-align: center;

            box-shadow: 0 12px 35px rgba(0,0,0,0.5);
        }

        h1 {
            color: #51391f;
            font-size: 32px;
            margin-bottom: 5px;
        }

        .subtitulo {
            color: #765b36;
            font-size: 16px;
            margin-bottom: 25px;
        }

        .imagem-gauss {
            width: 130px;
            height: 130px;
            margin: 0 auto 15px;
            display: block;
        }

        .campos {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 15px;
            flex-wrap: wrap;
            margin-bottom: 25px;
        }

        .campo {
            width: 145px;
            padding: 14px;
            font-size: 24px;
            font-family: Georgia, serif;
            font-weight: bold;

            text-align: center;

            color: #49351f;
            background: #fff9e9;

            border: 2px solid #a88755;
            border-radius: 8px;
            outline: none;
        }

        .campo:focus {
            border-color: #70491f;
            box-shadow: 0 0 8px rgba(112,73,31,0.3);
        }

        .operacoes {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-bottom: 25px;
        }

        .botao {
            width: 75px;
            height: 75px;

            border: none;
            border-radius: 12px;

            background: #76532c;
            color: white;

            font-size: 38px;
            font-family: Georgia, serif;

            cursor: pointer;
            transition: 0.3s;
        }

        .botao:hover {
            background: #4e351b;
            transform: translateY(-4px);
            box-shadow: 0 5px 12px rgba(0,0,0,0.3);
        }

        .botao:active {
            transform: scale(0.95);
        }

        .resultado-area {
            margin-top: 15px;
        }

        .resultado-area label {
            display: block;
            color: #51391f;
            font-weight: bold;
            font-size: 20px;
            margin-bottom: 10px;
        }

        #resultado {
            width: 80%;
            max-width: 350px;
            background: #fff4d6;
            color: #4e351b;
            border: 2px solid #8b693d;
        }

        #mensagem {
            min-height: 22px;
            margin-top: 15px;
            color: #a12b1c;
            font-family: Arial, sans-serif;
            font-size: 14px;
            font-weight: bold;
        }

        .limpar {
            margin-top: 15px;
            padding: 12px 25px;

            background: #51391f;
            color: white;

            border: none;
            border-radius: 8px;

            font-size: 15px;
            cursor: pointer;
        }

        .limpar:hover {
            background: #76532c;
        }

        .rodape {
            margin-top: 25px;
            color: #765b36;
            font-size: 13px;
        }

        input::-webkit-inner-spin-button,
        input::-webkit-outer-spin-button {
            -webkit-appearance: none;
            margin: 0;
        }

        input[type="number"] {
            appearance: textfield;
        }

        @media (max-width: 500px) {

            .quadro {
                padding: 22px 12px;
            }

            h1 {
                font-size: 25px;
            }

            .campo {
                width: 115px;
                font-size: 20px;
            }

            .botao {
                width: 65px;
                height: 65px;
            }

        }

    </style>

</head>

<body>

    <div class="quadro">

        <!-- ILUSTRAÇÃO SVG EMBUTIDA -->

        <svg class="imagem-gauss" viewBox="0 0 150 150"
             xmlns="http://www.w3.org/2000/svg">

            <circle cx="75" cy="75" r="70" fill="#b99763"/>

            <circle cx="75" cy="75" r="61"
                    fill="#e9d5a5" stroke="#76532c" stroke-width="3"/>

            <!-- Cabelo -->
            <path d="M35 69 Q25 25 75 24 Q125 25 115 69
                     L107 52 Q95 38 75 40 Q53 37 43 54Z"
                  fill="#59412c"/>

            <!-- Rosto -->
            <path d="M47 57 Q42 104 75 112 Q108 104 103 57
                     Q91 42 75 43 Q58 42 47 57Z"
                  fill="#d5a879"/>

            <!-- Cabelo lateral -->
            <path d="M47 53 Q36 62 43 89 L51 79 L51 57Z"
                  fill="#59412c"/>

            <path d="M103 53 Q114 62 107 89 L99 79 L99 57Z"
                  fill="#59412c"/>

            <!-- Olhos -->
            <path d="M57 70 Q64 65 69 70"
                  stroke="#49351f" stroke-width="2" fill="none"/>

            <path d="M81 70 Q88 65 94 70"
                  stroke="#49351f" stroke-width="2" fill="none"/>

            <!-- Nariz -->
            <path d="M75 70 L71 87 L78 87"
                  stroke="#986c48" stroke-width="2" fill="none"/>

            <!-- Bigode -->
            <path d="M60 91 Q67 86 75 93 Q83 86 91 91
                     Q85 103 75 97 Q65 103 60 91Z"
                  fill="#59412c"/>

            <!-- Roupa -->
            <path d="M29 133 Q35 105 59 108 L75 120
                     L91 108 Q115 105 121 133Z"
                  fill="#49351f"/>

            <path d="M59 108 L75 128 L91 108"
                  fill="#f1e3c5"/>

        </svg>

        <h1>Calculadora de Gauss</h1>

        <p class="subtitulo">
            Somatório e produtório de números inteiros
        </p>


        <!-- CAMPOS -->

        <div class="campos">

            <input
                type="number"
                id="valor1"
                class="campo"
                placeholder="Inicial"
                step="1"
            >

            <input
                type="number"
                id="valor2"
                class="campo"
                placeholder="Final"
                step="1"
            >

        </div>


        <!-- OPERAÇÕES -->

        <div class="operacoes">

            <button
                class="botao"
                id="soma"
                title="Somatório"
            >
                Σ
            </button>

            <button
                class="botao"
                id="produtorio"
                title="Produtório"
            >
                Π
            </button>

        </div>


        <!-- RESULTADO -->

        <div class="resultado-area">

            <label for="resultado">Resultado:</label>

            <input
                type="text"
                id="resultado"
                class="campo"
                readonly
                placeholder="0"
            >

        </div>


        <div id="mensagem"></div>


        <button class="limpar" id="limpar">
            Limpar calculadora
        </button>


        <div class="rodape">
            Matemática • Somatório • Produtório
        </div>

    </div>


    <script>

        // PEGANDO OS ELEMENTOS

        const valor1 = document.getElementById("valor1");
        const valor2 = document.getElementById("valor2");

        const resultado = document.getElementById("resultado");

        const botaoSoma = document.getElementById("soma");
        const botaoProdutorio = document.getElementById("produtorio");

        const mensagem = document.getElementById("mensagem");


        // FUNÇÃO PARA VERIFICAR OS NÚMEROS

        function verificarValores() {

            const numero1 = Number(valor1.value);
            const numero2 = Number(valor2.value);

            if (valor1.value === "" || valor2.value === "") {

                mensagem.innerText = "Digite os dois números!";
                resultado.value = "";
                return false;

            }

            if (!Number.isInteger(numero1) || !Number.isInteger(numero2)) {

                mensagem.innerText = "Digite apenas números inteiros!";
                resultado.value = "";
                return false;

            }

            if (numero1 > numero2) {

                mensagem.innerText = "O número inicial deve ser menor ou igual ao final!";
                resultado.value = "";
                return false;

            }

            if (numero2 - numero1 > 10000) {

                mensagem.innerText = "O intervalo máximo permitido é de 10.000!";
                resultado.value = "";
                return false;

            }

            mensagem.innerText = "";

            return true;

        }


        // SOMATÓRIO

        botaoSoma.addEventListener("click", function() {

            if (!verificarValores()) {
                return;
            }

            const numero1 = Number(valor1.value);
            const numero2 = Number(valor2.value);

            let soma = 0;

            for (let i = numero1; i <= numero2; i++) {

                soma = soma + i;

            }

            resultado.value = soma;

        });


        // PRODUTÓRIO

        botaoProdutorio.addEventListener("click", function() {

            if (!verificarValores()) {
                return;
            }

            const numero1 = Number(valor1.value);
            const numero2 = Number(valor2.value);

            let produto = 1;

            for (let i = numero1; i <= numero2; i++) {

                produto = produto * i;

            }

            resultado.value = produto;

        });


        // LIMPAR CAMPOS

        document.getElementById("limpar").addEventListener("click", function() {

            valor1.value = "";
            valor2.value = "";
            resultado.value = "";
            mensagem.innerText = "";

        });

    </script>

</body>
</html>
